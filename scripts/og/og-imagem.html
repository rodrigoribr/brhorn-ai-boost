<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">

<style>

  body{width:1200px;height:630px;background:#f7f6f2;color:#161a3a;font-family:"IBM Plex Sans",sans-serif;position:relative;overflow:hidden}
